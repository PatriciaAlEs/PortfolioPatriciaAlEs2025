services:
  - type: web
    name: portfolio-api
    runtime: python
    buildCommand: "npm install; npm run build; pip install --upgrade pip; pip install -r api/requirements.txt"
    startCommand: "gunicorn --chdir api --bind 0.0.0.0:$PORT --workers 4 app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FLASK_ENV
        value: production

databases:
  - name: portfolio-db
    region: oregon
    plan: free
