services:
  # Backend API (Flask) que también sirve el frontend
  - type: web
    name: portfolio-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn --chdir api app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20.0.0
      - key: VITE_API_URL
        value: https://portfolio-api.onrender.com/api
      - key: DB_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FLASK_APP
        value: api/app.py

# Base de datos PostgreSQL
databases:
  - name: portfolio-db
    region: oregon
    plan: free
